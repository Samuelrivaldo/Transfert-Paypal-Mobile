<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Transfert MoMo Sandbox</title>
    <style>
        body { font-family: Arial; background: #f4f4f4; padding: 30px; }
        form { background: #fff; padding: 20px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { padding: 10px; margin: 10px 0; width: 100%; }
        button { background: #2c87f0; color: white; border: none; cursor: pointer; }
        button:hover { background: #165fc9; }
        #result { background: #eee; padding: 15px; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<h2 align="center">Transfert MoMo (Sandbox)</h2>

<form id="momoForm">
    <label for="phone">Numéro Mobile Money :</label>
    <input type="text" id="phone" name="phone" placeholder="Ex: 46733123454" required>

    <label for="amount">Montant :</label>
    <input type="number" id="amount" name="amount" placeholder="Ex: 2000" required>

    <button type="submit">Envoyer</button>
</form>

<div id="result"></div>

<script>
document.getElementById("momoForm").addEventListener("submit", function(e) {
    e.preventDefault();
    const phone = document.getElementById("phone").value;
    const amount = document.getElementById("amount").value;
    const result = document.getElementById("result");

    result.innerHTML = "⏳ Transfert en cours...";

    fetch("transfert.php", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: `phone=${encodeURIComponent(phone)}&amount=${encodeURIComponent(amount)}`
    })
    .then(res => res.text())
    .then(data => result.innerHTML = data)
    .catch(err => result.innerHTML = "<b>Erreur réseau :</b> " + err);
});
</script>

</body>
</html>
